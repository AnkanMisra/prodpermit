<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">ProdPermit system architecture</title>
  <desc id="description">A WebMCP agent and a human operator use a Next.js workspace. Vercel and Cloudflare route calls to a Rust API that owns authorization and persists recovery state in SQLite.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="authority" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12372f"/>
      <stop offset="1" stop-color="#102a2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#background)"/>
  <text x="50" y="56" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Human-approved recovery over WebMCP</text>
  <text x="50" y="84" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">The agent gathers evidence. Rust enforces authority. A person approves the exact change.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="112" width="326" height="420" rx="18" fill="#0d1728" stroke="#2563eb" stroke-opacity="0.62"/>
    <text x="64" y="146" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.8">BROWSER TRUST BOUNDARY</text>

    <rect x="64" y="174" width="128" height="86" rx="12" fill="#101f35" stroke="#38bdf8" filter="url(#shadow)"/>
    <circle cx="88" cy="202" r="8" fill="#38bdf8"/>
    <text x="106" y="207" fill="#f8fafc" font-size="17" font-weight="650">Agent</text>
    <text x="84" y="234" fill="#94a3b8" font-size="12">Calls typed tools</text>

    <rect x="214" y="174" width="128" height="86" rx="12" fill="#2a1721" stroke="#fb7185" filter="url(#shadow)"/>
    <circle cx="238" cy="202" r="8" fill="#fb7185"/>
    <text x="256" y="207" fill="#f8fafc" font-size="17" font-weight="650">Person</text>
    <text x="234" y="234" fill="#cbd5e1" font-size="12">Approves fingerprint</text>

    <rect x="64" y="302" width="278" height="196" rx="14" fill="#111c30" stroke="#818cf8" stroke-opacity="0.85"/>
    <text x="86" y="337" fill="#f8fafc" font-size="18" font-weight="650">Next.js workspace</text>
    <text x="86" y="362" fill="#a5b4fc" font-size="12">document.modelContext</text>
    <rect x="86" y="386" width="109" height="31" rx="15" fill="#172554"/>
    <text x="102" y="406" fill="#bfdbfe" font-size="11">6 initial tools</text>
    <rect x="205" y="386" width="115" height="31" rx="15" fill="#3f1525"/>
    <text x="219" y="406" fill="#fecdd3" font-size="11">1 gated tool</text>
    <text x="86" y="450" fill="#94a3b8" font-size="12">Validates wire data</text>
    <text x="86" y="474" fill="#94a3b8" font-size="12">Registers and removes capabilities</text>

    <rect x="394" y="112" width="286" height="420" rx="18" fill="#151426" stroke="#7c3aed" stroke-opacity="0.62"/>
    <text x="418" y="146" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.8">PUBLIC EDGE</text>

    <rect x="422" y="191" width="230" height="91" rx="12" fill="#211a38" stroke="#8b5cf6" filter="url(#shadow)"/>
    <text x="448" y="226" fill="#f8fafc" font-size="17" font-weight="650">Vercel</text>
    <text x="448" y="252" fill="#a78bfa" font-size="12">Frontend and same-origin rewrite</text>

    <rect x="422" y="338" width="230" height="91" rx="12" fill="#211a38" stroke="#8b5cf6" filter="url(#shadow)"/>
    <text x="448" y="373" fill="#f8fafc" font-size="17" font-weight="650">Cloudflare Tunnel</text>
    <text x="448" y="399" fill="#a78bfa" font-size="12">Outbound HTTPS ingress</text>

    <rect x="708" y="112" width="452" height="420" rx="18" fill="url(#authority)" stroke="#10b981" stroke-opacity="0.68"/>
    <text x="732" y="146" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1.8">SERVER AUTHORITY BOUNDARY</text>

    <rect x="736" y="174" width="184" height="108" rx="12" fill="#0e2c29" stroke="#34d399" filter="url(#shadow)"/>
    <text x="760" y="210" fill="#f8fafc" font-size="18" font-weight="650">Rust and Axum</text>
    <text x="760" y="236" fill="#a7f3d0" font-size="12">Domain rules</text>
    <text x="760" y="258" fill="#a7f3d0" font-size="12">Authorization checks</text>

    <rect x="950" y="174" width="182" height="108" rx="12" fill="#272313" stroke="#fbbf24" filter="url(#shadow)"/>
    <text x="974" y="210" fill="#f8fafc" font-size="18" font-weight="650">SQLite</text>
    <text x="974" y="236" fill="#fde68a" font-size="12">Plans and evidence</text>
    <text x="974" y="258" fill="#fde68a" font-size="12">Atomic audit record</text>

    <rect x="736" y="326" width="396" height="172" rx="14" fill="#0c2322" stroke="#34d399" stroke-opacity="0.72"/>
    <text x="760" y="359" fill="#f8fafc" font-size="16" font-weight="650">One exact recovery capability</text>
    <g font-size="11" text-anchor="middle">
      <rect x="760" y="390" width="75" height="34" rx="17" fill="#123148" stroke="#38bdf8"/>
      <text x="797.5" y="411" fill="#bae6fd">Investigate</text>
      <text x="849" y="411" fill="#64748b">→</text>
      <rect x="863" y="390" width="68" height="34" rx="17" fill="#123148" stroke="#38bdf8"/>
      <text x="897" y="411" fill="#bae6fd">Prepare</text>
      <text x="945" y="411" fill="#64748b">→</text>
      <rect x="959" y="390" width="68" height="34" rx="17" fill="#3b1825" stroke="#fb7185"/>
      <text x="993" y="411" fill="#fecdd3">Approve</text>
      <text x="1041" y="411" fill="#64748b">→</text>
      <rect x="1055" y="390" width="54" height="34" rx="17" fill="#12372f" stroke="#34d399"/>
      <text x="1082" y="411" fill="#a7f3d0">Run</text>
    </g>
    <text x="760" y="459" fill="#94a3b8" font-size="12">Recheck session, fingerprint, expiry, release, and replay state</text>

    <path d="M128 260 V286 H142 V302" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="84" y="283" fill="#7dd3fc" font-size="11">invoke</text>
    <path d="M278 260 V288 H330 V302" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
    <text x="286" y="281" fill="#fda4af" font-size="11">approve</text>
    <path d="M342 350 H380 V236 H410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="348" y="339" fill="#7dd3fc" font-size="11">API</text>
    <path d="M537 282 V326" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M652 384 H694 V228 H724" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M920 228 H938" fill="none" stroke="#34d399" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <path d="M736 465 H690 V488 H354" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>
    <text x="505" y="479" fill="#6ee7b7" font-size="11">temporary execution tool</text>

    <circle cx="52" cy="578" r="5" fill="#38bdf8"/>
    <text x="66" y="583" fill="#94a3b8" font-size="12">Tool and data flow</text>
    <circle cx="220" cy="578" r="5" fill="#fb7185"/>
    <text x="234" y="583" fill="#94a3b8" font-size="12">Human authority</text>
    <circle cx="380" cy="578" r="5" fill="#34d399"/>
    <text x="394" y="583" fill="#94a3b8" font-size="12">Server authorization</text>
    <text x="50" y="616" fill="#64748b" font-size="11">Tailscale Funnel remains available as fallback ingress.</text>
  </g>
</svg>
